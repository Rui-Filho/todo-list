<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do-list</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="https://kit.fontawesome.com/45a2d1d067.js" crossorigin="anonymous"></script>

</head>
<body>

    <div class="todo-container">

        <header>
            <h1>Todo avançado</h1>

        </header>

        <form  id="todo-form">

            <p>Adicione sua tarefa</p>

            <div class="form-control">

                <input type="text" id="todo-input" placeholder="O que você vai fazer?">

                <button type="submit">
                    
                    <i class="fa-solid fa-upload"></i>

                </button>


            </div>


        </form>

        <form  id="edit-form">

            <p>Edite a sua tarefa:</p>

            <div class="form-control">

                <input type="text" id="edit-input">

                <button type="submit">

                    <i class="fa-solid fa-pen-to-square"></i>

                </button>              



            </div>

             <button>


                    <i class="fa-solid fa-circle-xmark"></i>


                </button>


        </form>

        <div id="toolbar">

            <div id="search">

                <h4>Pesquisar:</h4>
                <form >

                    <input type="text" id="search-input" placeholder="Buscar">

                    <button id="erase-button">

                        <i class="fa-solid fa-delete-left"></i>

                    </button>

                </form>
            </div>

            <div id="filter">
                <h4>Filtrar:</h4>
                <select name="" id="filter-select">

                    <option value="all">Todos</option>
                    <option value="done">Feitos</option>
                    <option value="todo">A fazer</option>


                </select>
            </div>


        </div>

        <div id="todo-list">

            <div class="todo">

                <h3>Estou fazendo alguma coisa importante...</h3>

                <button class="finish-todo">

                    <i class="fa-solid fa-check"></i>


                </button>

                 <button class="edit-todo">

                    <i class="fa-solid fa-pen"></i>


                </button>

                 <button class="remove-todo">

                    <i class="fa-solid fa-xmark"></i>


                </button>

                 <h3>Estudar JavaScript...</h3>

                <button class="finish-todo">

                    <i class="fa-solid fa-check"></i>


                </button>

                 <button class="edit-todo">

                    <i class="fa-solid fa-pen"></i>


                </button>

                 <button class="remove-todo">

                    <i class="fa-solid fa-xmark"></i>


                </button>


            </div>


        </div>



    </div>
    
</body>
</html>
